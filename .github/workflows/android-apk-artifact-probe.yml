name: CI Lab Android APK + Artifact Probe

on:
  push:
    branches:
      - ci-lab-apk-artifact-probe

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build isolated sample APK and upload artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated CI lab
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build sample debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload sample APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-lab-sample-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
