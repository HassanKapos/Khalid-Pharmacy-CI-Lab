name: Khalid Pharmacy - Isolated CI Lab

on:
  workflow_dispatch:
  push:
    branches:
      - pharmacy-integration-test

permissions:
  contents: read

concurrency:
  group: khalid-pharmacy-ci-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-regression-tests:
    name: Web build and offline regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated test snapshot
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm ci --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Prepare local OCR runtime and build web app
        run: npm run build
      - name: Pricing and medicine unit policy
        run: npm run test:phase2a
      - name: Inventory cost and stock policy
        run: npm run test:phase2b
      - name: Medicine text recognition safety
        run: npm run test:medicine-recognition
      - name: Offline OCR asset validation
        run: npm run test:web-ocr-offline
      - name: Tesseract OCR integration
        run: npm run test:ocr-tesseract
      - name: Batch capture and single-image OCR
        run: npm run test:phase3-6b
      - name: Local persistence and Bankak migration
        run: |
          npm run test:phase1a-local
          npm run test:phase1a-bankak-migration
      - name: Bankak Phase A acceptance suite
        id: bankak_phase_a
        continue-on-error: true
        run: npm run test:bankak-phase-a
      - name: Backup encryption, serialization and restore sandbox
        run: |
          npm run test:backup-encryption
          npm run test:backup-serializer
          npm run test:restore-sandbox
      - name: Google Drive OAuth boundary tests (mocked)
        run: |
          npm run test:google-drive-oauth
          npm run test:google-drive-oauth-platform
      - name: Bankak retention and diagnostics
        run: |
          npm run test:bankak-retention
          npm run test:error-logs
      - name: Multi-branch security tests
        id: multi_branch
        continue-on-error: true
        run: npm run test:multi-branch
      - name: Phase 2D packing lock coordinator
        id: packing_lock
        continue-on-error: true
        run: npm run test:pr2d-packing-lock
      - name: Phase 2D PR2C exact costing and pricing
        id: phase2d_pr2c
        continue-on-error: true
        run: npm run test:phase2d-pr2c
      - name: Preserve required regression failure status
        if: always()
        run: |
          if [ "${{ steps.bankak_phase_a.outcome }}" = "failure" ] || [ "${{ steps.multi_branch.outcome }}" = "failure" ] || [ "${{ steps.packing_lock.outcome }}" = "failure" ] || [ "${{ steps.phase2d_pr2c.outcome }}" = "failure" ]; then
            echo "::error::One or more required regression suites failed; see their logs."
            exit 1
          fi

  android-debug-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]')
    name: Android Debug APK build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated test snapshot
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build web assets including local OCR runtime
        run: npm run build
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Assemble pharmacy Debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Verify APK exists and is non-empty
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload pharmacy Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khalid-pharmacy-ci-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
