name: Firestore Emulator Runtime Smoke Test

on:
  push:
    branches:
      - test/firestore-emulator-runtime-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator-smoke:
    name: Verify Java, Firebase CLI, and real Firestore Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated CI lab
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          java -version
          npx --yes firebase-tools@latest --version

      - name: Create isolated deny-all emulator fixture
        run: |
          mkdir -p scripts
          cat > firebase.json <<'JSON'
          {
            "firestore": { "rules": "firestore.rules" },
            "emulators": {
              "firestore": { "port": 8080, "host": "127.0.0.1" },
              "ui": { "enabled": false }
            }
          }
          JSON
          cat > firestore.rules <<'RULES'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if false;
              }
            }
          }
          RULES
          cat > scripts/check-firestore-emulator.mjs <<'JS'
          const project = "demo-khalid-ci-lab";
          const base = `http://127.0.0.1:8080/v1/projects/${project}/databases/(default)/documents`;
          const read = await fetch(`${base}/smoke/read-check`);
          const write = await fetch(`${base}/smoke/write-check`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fields: { probe: { stringValue: "must-be-denied" } } })
          });
          console.log(`READ_STATUS=${read.status}`);
          console.log(`WRITE_STATUS=${write.status}`);
          if (read.status !== 403 || write.status !== 403) {
            throw new Error("Deny-all rules were not enforced as expected by the Firestore Emulator.");
          }
          console.log("FIRESTORE_EMULATOR_SMOKE=PASS");
          JS

      - name: Run real Firestore Emulator and verify deny-all rules
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-khalid-ci-lab --non-interactive "node scripts/check-firestore-emulator.mjs"
