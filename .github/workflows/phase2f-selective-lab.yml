name: Phase 2F Selective Verification Lab

on:
  workflow_dispatch:
  push:
    branches:
      - phase2f-selective-import
    paths:
      - 'phase2f-lab/**'
      - '.github/workflows/phase2f-selective-lab.yml'

permissions:
  contents: read

jobs:
  phase2f-isolated-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase2f-lab
    steps:
      - name: Checkout CI Lab only
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install isolated dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type-check
        run: npm run typecheck

      - name: PR-F1 — Pure foundation suite
        run: npm run test:pr-f1

      - name: PR-F0 — Rules and Auth/Firestore emulator suite
        run: npx --yes firebase-tools emulators:exec --project demo-khalid-pharmacy --only firestore,auth "npx tsx scripts/test-phase2e-b3-r32-emulator.ts"

      - name: PR-F2 — Firestore integration emulator suite
        run: npx --yes firebase-tools emulators:exec --project demo-khalid-pharmacy --only firestore,auth "npx tsx scripts/test-phase2f-firestore-integration-emulator.ts"

      - name: PR-F3 — Offline sidecar emulator suite (test shim)
        run: npx --yes firebase-tools emulators:exec --project demo-khalid-pharmacy --only firestore,auth "npx tsx scripts/test-phase2f-pr-f3-offline-emulator.ts"
