<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-opacity="0.4"/>
  <g filter="url(#shadow)">
    <!-- Medical Cross -->
    <rect x="220" y="140" width="72" height="232" rx="20" fill="#ffffff"/>
    <rect x="140" y="220" width="232" height="72" rx="20" fill="#ffffff"/>
  </g>
</svg>